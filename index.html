<style>

:root{
  --paper: rgba(250,248,244,.92);
  --paper-solid:#faf8f4;
  --ink:#2b2722;
  --ink-soft:#6d655b;
  --oak:#a9875d;
  --oak-deep:#7f6240;
  --line:rgba(60,50,40,.14);
  --chip:#efe9df;
  --sun:#d98b2b;
  --stage:#e9e6e0;
  --font:"Heebo", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper: rgba(30,28,25,.9); --paper-solid:#1e1c19; --ink:#f1ece4; --ink-soft:#b3a999; --oak:#c9a374; --oak-deep:#e0bf92;
  --line:rgba(255,240,220,.14); --chip:#2c2925; --sun:#f0a948; --stage:#1a1917; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper: rgba(30,28,25,.9); --paper-solid:#1e1c19; --ink:#f1ece4; --ink-soft:#b3a999; --oak:#c9a374; --oak-deep:#e0bf92;
  --line:rgba(255,240,220,.14); --chip:#2c2925; --sun:#f0a948; --stage:#1a1917; color-scheme:dark }
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--stage);color:var(--ink);font-family:var(--font)}
#stage{position:fixed;inset:0;touch-action:none}
#stage canvas{display:block;width:100%;height:100%;outline:none}
.card{position:fixed;background:var(--paper);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,.12);direction:rtl;z-index:5}
#top{top:calc(env(safe-area-inset-top,0px) + 12px);right:max(12px,env(safe-area-inset-right,0px));padding:10px 12px;display:flex;flex-direction:column;gap:8px;width:min(300px,calc(100vw - 24px - 64px));box-sizing:border-box}
.brand{display:flex;align-items:baseline;gap:8px;justify-content:space-between}
.brand b{font-size:17px;font-weight:700;letter-spacing:.2px}
.brand span{font-size:12px;color:var(--ink-soft);flex:1;min-width:0;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#topToggle{width:28px;height:28px;font-size:15px;flex:none}
#top.min{width:auto;padding:6px 8px 6px 12px}
#top.min>:not(.brand),#top.min .brand span{display:none}
#top.min .brand{align-items:center;gap:10px}
.seg{display:flex;background:var(--chip);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;color:var(--ink);font:500 13px var(--font);padding:7px 4px;border-radius:8px;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--paper-solid);box-shadow:0 1px 3px rgba(0,0,0,.15);color:var(--oak-deep)}
.seg button:focus-visible,.btn:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--oak);outline-offset:2px}
.row{display:flex;gap:8px;align-items:center}
.lbl{font-size:12px;color:var(--ink-soft);min-width:52px}
select{flex:1;min-width:0;font:500 13px var(--font);color:var(--ink);background:var(--chip);border:0;border-radius:9px;padding:7px 8px}
#sun{left:max(12px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 12px);padding:12px 14px;width:min(360px,calc(100vw - 24px));box-sizing:border-box;display:flex;flex-direction:column;gap:8px}
.sunhead{display:flex;align-items:center;gap:10px}
.sunhead .t{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;flex:1;display:flex;gap:8px;align-items:baseline}
.sunhead .t small{font-weight:400;color:var(--ink-soft);font-size:12px}
.btn{border:0;background:var(--chip);color:var(--ink);font:500 12.5px var(--font);border-radius:9px;padding:6px 10px;cursor:pointer}
.btn.round{width:34px;height:34px;padding:0;font-size:14px;display:grid;place-items:center}
.btn.on{background:var(--sun);color:#fff}
.slide{display:grid;grid-template-columns:44px 1fr;align-items:center;gap:8px}
.slide span{font-size:12px;color:var(--ink-soft)}
input[type=range]{width:100%;accent-color:var(--sun);direction:ltr;margin:0}
.quick{display:flex;flex-wrap:wrap;gap:6px}
.meta{font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums;line-height:1.5}
#sunChip{display:none}
#sun .body{display:flex;flex-direction:column;gap:8px}
#sun.min .body{display:none}
body.walk #cutRow{display:none}
#sun.min{width:auto;padding:8px 10px}
#compass{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:max(12px,env(safe-area-inset-left,0px));width:52px;height:52px;border-radius:50%;background:var(--paper);border:1px solid var(--line);box-shadow:0 6px 24px rgba(0,0,0,.12);z-index:5;display:grid;place-items:center}
#needle{width:4px;height:36px;position:relative;transform-origin:50% 50%}
#needle:before{content:"";position:absolute;left:-5px;top:0;border-left:7px solid transparent;border-right:7px solid transparent;border-bottom:18px solid #c4472d}
#needle:after{content:"";position:absolute;left:-5px;bottom:0;border-left:7px solid transparent;border-right:7px solid transparent;border-top:18px solid var(--ink-soft)}
#compass b{position:absolute;top:1px;font-size:10px;color:var(--ink-soft);font-weight:700}

body.walk.touch #sun{bottom:calc(env(safe-area-inset-bottom,0px) + 160px)}
@media (max-width:700px){
  #hint{display:none}
  #top{width:calc(100vw - 24px - 70px)}
}
@media (prefers-reduced-motion: reduce){#hint{transition:none}}

    <span class="lbl">תצוגה</span>

      <button id="c-ground" data-c="ground">קרקע</button>
    </div>
  </div>
  <div class="row">
    <span class="lbl">איכות</span>

      <button data-q="std">רגילה</button>
      <button data-q="pt" id="q-pt" title="רינדור Path Tracing — אור ושתקפויות אמיתיים. דורש מחשב עם כרטיס מסך; התמונה מתחדדת כשהמצלמה עומדת">ריאליסטית</button>
    </div>
  </div>
  <div class="row">
    <label class="lbl" for="room">קפיצה ל</label>
    <select id="room"></select>
  </div>
</header>

<section class="card" id="sun" aria-label="שמש">
  <div class="sunhead">
    <button class="btn round" id="sunToggle" aria-label="הצג או הסתר את בקרת השמש">☀</button>
    <div class="t" id="sunTitle">—</div>
    <button class="btn round" id="play" aria-label="הפעל תנועת שמש">▶</button>
  </div>
  <div class="body">
    <div class="slide"><span>שעה</span><input id="time" type="range" min="240" max="1260" step="5" aria-label="שעה ביום"></div>
    <div class="slide"><span>תאריך</span><input id="day" type="range" min="1" max="365" step="1" aria-label="יום בשנה"></div>
    <div class="quick">
      <button class="btn" data-d="172">21 ביוני</button>
      <button class="btn" data-d="80">21 במרץ</button>
      <button class="btn" data-d="355">21 בדצמבר</button>
      <button class="btn" id="now">עכשיו</button>
    </div>
    <div class="meta" id="sunMeta">—</div>
  </div>
</section>

<div id="compass" aria-hidden="true"><b>N</b><div id="needle"></div></div>
<div id="joy" aria-hidden="true"><div id="knob"></div></div>
<div id="hint"></div>
<div id="ptStatus" hidden></div>

  const L=((280.460+0.9856474*n)%360+360)%360;
  const g=(((357.528+0.9856003*n)%360+360)%360)*D2R;
  const lam=(L+1.915*Math.sin(g)+0.020*Math.sin(2*g))*D2R;
  const eps=(23.439-0.0000004*n)*D2R;
  const ra=Math.atan2(Math.cos(eps)*Math.sin(lam),Math.cos(lam));
  const dec=Math.asin(Math.sin(eps)*Math.sin(lam));
  const gmst=((280.46061837+360.98564736629*n)%360+360)%360;
  const H=(gmst+LON)*D2R-ra, la=LAT*D2R;
  const alt=Math.asin(Math.sin(la)*Math.sin(dec)+Math.cos(la)*Math.cos(dec)*Math.cos(H));

  return {alt, az:(az+2*Math.PI)%(2*Math.PI)};
}
